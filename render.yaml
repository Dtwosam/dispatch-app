services:
  - type: web
    name: dispatch-evaluator
    runtime: node
    rootDir: .
    plan: free
    buildCommand: npm ci && npm --workspace packages/shared run build && npm --workspace apps/evaluator run build
    startCommand: npm --workspace apps/evaluator run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4030"

  - type: web
    name: dispatch-router
    runtime: node
    rootDir: .
    plan: free
    buildCommand: npm ci && npm --workspace packages/shared run build && npm --workspace packages/agent-sdk run build && npm --workspace apps/router run build
    startCommand: npm --workspace apps/router run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4020"
      - key: EVALUATOR_BASE_URL
        fromService:
          type: web
          name: dispatch-evaluator
          property: hostport
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ROUTER_STORE_KEY
        value: dispatch_router_store
      - key: ROUTER_PUBLIC_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://dispatch-arc.vercel.app
      - key: ADMIN_WALLETS
        sync: false
      - key: ROUTER_AGENT_SHARED_SECRET
        sync: false
      - key: ROUTER_CALLBACK_SECRET
        sync: false
      - key: OWNER_PROOF_VERIFIER_URL
        sync: false
      - key: ALLOW_INSECURE_DEV_OWNER_PROOFS
        sync: false
      - key: PLATFORM_FEE_BPS
        value: "250"
      - key: EXECUTION_MAX_RETRIES
        value: "3"
      - key: EXECUTION_BASE_BACKOFF_MS
        value: "1500"
      - key: EXECUTION_TIMEOUT_MS
        value: "120000"
      - key: EXECUTION_ENDPOINT_ALLOWLIST
        sync: false
      - key: TRUST_CACHE_TTL_MS
        value: "30000"
      - key: TRUST_RECOMPUTE_INTERVAL_MS
        value: "60000"
      - key: ENABLE_MARKETPLACE_SEEDING
        value: "false"
      - key: ARC_RPC_URL
        value: https://rpc.testnet.arc.network
      - key: ARC_BROWSER_RPC_URL
        value: https://rpc.testnet.arc.network
      - key: ARC_CHAIN_ID
        value: "5042002"
      - key: ARC_CHAIN_KEY
        value: arcTestnet
      - key: ARC_CHAIN_MODE
        value: browser_wallet
      - key: ARC_NETWORK_NAME
        value: Arc Testnet
      - key: ARC_TASK_MARKETPLACE_ADDRESS
        value: 0xbd79cff0ff452b566f7c84ffc4dd4a2ee24c73eb
      - key: ARC_AGENT_REGISTRY_ADDRESS
        value: 0x9bd24fdf0563e6cf6827e02eb5dfd4f84ae20eeb
      - key: ARC_PAYMENT_TOKEN_ADDRESS
        value: 0x3600000000000000000000000000000000000000
      - key: ARC_PAYMENT_TOKEN_SYMBOL
        value: "USDC"
      - key: ARC_PAYMENT_TOKEN_DECIMALS
        value: "6"
      - key: ARC_GAS_TOKEN_SYMBOL
        value: "USDC"
      - key: ARC_GAS_TOKEN_DECIMALS
        value: "18"
      - key: ARC_EXPLORER_BASE_URL
        value: https://testnet.arcscan.app
      - key: ARC_SERVER_PRIVATE_KEY
        sync: false
      - key: ARC_SERVER_WALLET_ADDRESS
        value: 0x85DCC174dE5e785Cda3069154D097172F1B39aAA
      - key: DISPATCH_ENABLE_DEMO_FUNDING_FALLBACK
        value: "false"
