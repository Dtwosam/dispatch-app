networks:
  default: localnet
  localnet: {}
  studionet: {}
  testnet_bradbury:
    id: 4221
    url: https://rpc-bradbury.genlayer.com
    accounts:
      - "${ACCOUNT_PRIVATE_KEY_1}"
    # Current genlayer-test versions validate against known runtime buckets.
    # Bradbury is targeted through the URL/id above; testnet_asimov is the
    # closest accepted remote chain_type until the toolchain exposes Bradbury.
    chain_type: testnet_asimov

paths:
  contracts: .generated
  artifacts: artifacts

environment: .env
